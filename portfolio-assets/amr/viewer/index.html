<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AMR Robot | Interactive model</title>
<style>*{box-sizing:border-box}body{margin:0;background:#edf0ee;color:#1d302d;font:15px system-ui,sans-serif}header{position:absolute;top:32px;left:40px;z-index:2;pointer-events:none}.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#647772}h1{font-size:38px;letter-spacing:-.05em;margin:9px 0}header p{font-size:13px;color:#677872;margin:0}#view{width:100vw;height:100vh;display:block;touch-action:none}.toolbar{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);display:flex;gap:7px;padding:9px;border-radius:18px;background:#ffffffdf;box-shadow:0 8px 30px #23382b16}button{border:0;background:#e9eeeb;color:#203b32;border-radius:10px;padding:11px 15px;white-space:nowrap;cursor:pointer;font:inherit;font-size:13px}button:hover,button[aria-pressed=true]{background:#244d40;color:white}aside{position:absolute;right:32px;top:34px;width:220px;padding:20px;border-radius:16px;background:#ffffffd9}aside h2{font-size:17px;margin:0 0 9px}aside p{font-size:12px;line-height:1.6;color:#586d65}#status{position:absolute;left:40px;bottom:35px;font-size:11px;color:#61756c;max-width:200px}#error{background:#fff1e9;color:#902e0b;position:absolute;top:45%;left:10%;padding:20px;display:none}@media(max-width:650px){header{left:20px;top:20px}h1{font-size:30px}aside{top:auto;bottom:115px;left:20px;right:auto;width:calc(100% - 40px);max-height:115px;overflow:auto;padding:12px}aside p{margin:4px 0}.toolbar{bottom:20px;max-width:96vw;flex-wrap:wrap;justify-content:center;width:360px}button{padding:8px 10px;font-size:12px}#status{left:20px;top:115px;bottom:auto;width:auto;max-width:none}}</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script></head><body>
<header><div class="eyebrow">Hardware inspection</div><h1>AMR Robot</h1><p>Photo-guided reconstruction</p></header><canvas id="view" aria-label="Interactive 3D AMR model. Drag to rotate and pinch or Ctrl + scroll to zoom."></canvas>
<aside><h2 id="part">Explore the robot</h2><p id="description">Drag to rotate. Pinch or Ctrl + scroll to zoom. Click a component to identify it.</p></aside>
<div class="toolbar"><button id="full" aria-pressed="true">Full setup</button><button id="under" aria-pressed="false">Underneath</button><button id="home">Perspective</button><button id="top">Top</button><button id="front">Front</button><button id="wires" aria-pressed="true">Wiring</button><button id="plate" aria-pressed="true">Top plate</button></div><div id="status">Loading model…</div><div id="error" role="alert"></div>
<script type="module">
import * as THREE from 'three';import {GLTFLoader} from './vendor/GLTFLoader.js';import {OrbitControls} from './vendor/OrbitControls.js';
const canvas=document.querySelector('#view');const renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.95;
const scene=new THREE.Scene();scene.background=new THREE.Color('#edf0ee');const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.005,20);canvas.addEventListener('wheel', event => {
  if (!event.ctrlKey) event.stopImmediatePropagation();
}, { capture: true, passive: true });
const controls=new OrbitControls(camera,canvas);controls.enableDamping=true;controls.minDistance=.25;controls.maxDistance=1.8;controls.target.set(0,.025,-.06);camera.position.set(.5,.56,.62).multiplyScalar(Math.max(1,.95/camera.aspect));
scene.add(new THREE.HemisphereLight(0xffffff,0x889187,1.6));const key=new THREE.DirectionalLight(0xfff9eb,2.4);key.position.set(-.4,1,.6);key.castShadow=true;key.shadow.mapSize.set(2048,2048);Object.assign(key.shadow.camera,{left:-.5,right:.5,top:.5,bottom:-.5,near:.1,far:3});key.shadow.bias=-.0002;scene.add(key);const fill=new THREE.DirectionalLight(0xd1e6ff,1.2);fill.position.set(.5,.5,-.5);scene.add(fill);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(10,10),new THREE.ShadowMaterial({opacity:.13}));floor.rotation.x=-Math.PI/2;floor.position.y=-.042;floor.receiveShadow=true;scene.add(floor);
let model,meshes=[],selected,old;const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();const desc=document.querySelector('#description');
new GLTFLoader().load('./amr-robot.glb?v=2',g=>{model=g.scene;scene.add(model);model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;meshes.push(o)}});document.querySelector('#status').textContent='380 × 407 mm chassis · estimated proportions';window.amrReady=true;},undefined,e=>{document.querySelector('#error').style.display='block';document.querySelector('#error').textContent='The 3D model could not load. Please reload the page to try again.';console.error(e)});
function view(x,y,z){camera.position.set(x,y,z).multiplyScalar(Math.max(1,.95/camera.aspect));controls.target.set(0,.025,-.06);controls.update()}
document.querySelector('#home').onclick=()=>view(.5,.56,.62);document.querySelector('#top').onclick=()=>view(0,.88,-.059);document.querySelector('#front').onclick=()=>view(0,.20,.8);
let underneath=false,wiring=true,plate=true;
const chassisNames=new Set(['Drive_tyres','Wheel_hubs','Front_caster_wheel','Front_caster_fork','Lower_chassis_plate','Chassis_hardware']);
function clearSelection(){if(selected){selected.material.dispose();selected.material=old;selected=null}}
function applyVisibility(){clearSelection();for(const m of meshes){const lower=m.name.startsWith('Lower_')||chassisNames.has(m.name);m.visible=(!underneath||lower)&& (wiring|| !/wire|lead|cable|strap/i.test(m.name)) && (plate|| !/Top_plate/i.test(m.name));}}
function setup(lower){underneath=lower;if(!lower){plate=true;wiring=true;document.querySelector('#plate').setAttribute('aria-pressed','true');document.querySelector('#wires').setAttribute('aria-pressed','true');}applyVisibility();document.querySelector('#full').setAttribute('aria-pressed',!lower);document.querySelector('#under').setAttribute('aria-pressed',lower);document.querySelector('#plate').disabled=lower;document.querySelector('#part').textContent=lower?'Inside the AMR Robot':'Explore the robot';desc.textContent=lower?'Motor controller beneath the Jetson, adjacent 24 V battery, and a front-facing USB port for an Xbox controller. Select a part to explore.':'Drag to rotate. Pinch or Ctrl + scroll to zoom. Click a component to identify it.';view(.45,.58,.57);}
document.querySelector('#full').onclick=()=>setup(false);document.querySelector('#under').onclick=()=>setup(true);
document.querySelector('#wires').onclick=e=>{wiring=!wiring;e.currentTarget.setAttribute('aria-pressed',wiring);applyVisibility()};
document.querySelector('#plate').onclick=e=>{plate=!plate;e.currentTarget.setAttribute('aria-pressed',plate);applyVisibility()};
let down;canvas.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);canvas.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>5)return;pointer.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(pointer,camera);const hit=ray.intersectObjects(meshes.filter(m=>m.visible))[0];if(selected){selected.material=old;selected=null}if(!hit)return;selected=hit.object;old=selected.material;selected.material=old.clone();selected.material.emissive=new THREE.Color('#397b68');selected.material.emissiveIntensity=.35;document.querySelector('#part').textContent=selected.name.replaceAll('_',' ');desc.textContent=/Lower_Xbox/i.test(selected.name)?'USB connection for the Xbox controller used to drive the robot manually.':/Lower.*battery/i.test(selected.name)?'24 V battery beside the motor-control board on the lower deck.':/Lower_/i.test(selected.name)?'Lower-deck motor-control electronics, connectors and wiring. The main board sits beneath the Jetson.':/Jetson|Fan|GPIO|USB|Ethernet|Antenna/i.test(selected.name)?'Onboard compute, cooling and connections. Placement follows the supplied photographs.':/LCD|AMR_Robot/i.test(selected.name)?'Status display recreated from your powered-on photo: READY, BENJAMIN, CAM OK and LISTEN.':/camera|Webcam|Adesso/i.test(selected.name)?'The forward-facing Adesso 4K webcam.':/plate/i.test(selected.name)?'Revised upper deck with photo-estimated holes and access opening.':'Visual reconstruction. Small dimensions and hidden details are approximate.'});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
</script></body></html>
